<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>404 — Page Not Found | NEXORA EXPRESS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root {
            --green: #071b15;
            --green-2: #0d2820;
            --green-3: #15372c;

            --cream: #f1eadf;
            --ivory: #faf7f0;

            --orange: #e8753d;
            --amber: #f3b45c;

            --text: #171b19;
            --muted: #737a76;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: "DM Sans", sans-serif;
            background: var(--green);
            color: var(--ivory);
            overflow: hidden;
        }

        /* =====================================================
           PAGE
        ===================================================== */

        .error-page {
            min-height: 100svh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            isolation: isolate;
            background:
                radial-gradient(
                    circle at 50% 42%,
                    rgba(21, 55, 44, 0.9),
                    transparent 42%
                ),
                var(--green);
        }

        /* =====================================================
           BACKGROUND
        ===================================================== */

        .bg-grid {
            position: absolute;
            inset: 0;
            z-index: -3;
            opacity: 0.22;

            background-image:
                linear-gradient(
                    rgba(250,247,240,0.06) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(250,247,240,0.06) 1px,
                    transparent 1px
                );

            background-size: 70px 70px;

            mask-image: linear-gradient(
                to bottom,
                transparent,
                black 25%,
                black 75%,
                transparent
            );
        }

        .glow {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: rgba(232,117,61,0.08);
            filter: blur(70px);
            z-index: -2;
            animation: glowPulse 5s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%,
            100% {
                transform: scale(0.9);
                opacity: 0.5;
            }

            50% {
                transform: scale(1.15);
                opacity: 1;
            }
        }

        /* =====================================================
           TOP BRAND
        ===================================================== */

        .top-brand {
            position: absolute;
            top: 34px;
            left: 42px;

            display: flex;
            align-items: center;
            gap: 12px;

            text-decoration: none;
            color: var(--ivory);

            z-index: 20;
        }

        .brand-icon {
            width: 38px;
            height: 38px;

            display: grid;
            place-items: center;

            border: 1px solid rgba(250,247,240,0.18);
            background: rgba(250,247,240,0.06);

            color: var(--orange);

            font-size: 15px;
        }

        .brand-copy {
            display: flex;
            flex-direction: column;
            line-height: 1;
        }

        .brand-copy strong {
            font-family: "Manrope", sans-serif;
            font-size: 17px;
            letter-spacing: 0.08em;
        }

        .brand-copy span {
            margin-top: 5px;
            font-size: 8px;
            letter-spacing: 0.22em;
            color: rgba(250,247,240,0.5);
        }

        /* =====================================================
           MAIN CONTENT
        ===================================================== */

        .error-content {
            width: min(920px, 92%);
            text-align: center;
            position: relative;
            z-index: 10;

            padding-top: 20px;
        }

        .error-label {
            display: inline-flex;
            align-items: center;
            gap: 10px;

            margin-bottom: 24px;

            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.24em;
            color: var(--amber);
        }

        .error-label::before,
        .error-label::after {
            content: "";
            width: 28px;
            height: 1px;
            background: rgba(243,180,92,0.5);
        }

        /* =====================================================
           404 NUMBER
        ===================================================== */

        .error-number {
            position: relative;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 240px;

            font-family: "Manrope", sans-serif;
            font-size: clamp(150px, 22vw, 290px);
            font-weight: 800;
            line-height: 0.8;

            letter-spacing: -0.08em;

            color: rgba(250,247,240,0.08);

            user-select: none;
        }

        .number-zero {
            position: relative;
            width: 0.72em;
            height: 0.72em;

            border: clamp(13px, 2vw, 25px) solid
                rgba(250,247,240,0.09);

            border-radius: 50%;

            margin: 0 5px;
        }

        /* =====================================================
           FLYING LETTER
        ===================================================== */

        .flying-letter {
            position: absolute;

            width: 115px;
            height: 78px;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%)
                rotate(-8deg);

            z-index: 20;

            animation:
                letterJourney 3.8s
                cubic-bezier(.22,1,.36,1)
                infinite;
        }

        .letter-envelope {
            width: 100%;
            height: 100%;

            position: relative;

            background: var(--ivory);

            border-radius: 4px;

            box-shadow:
                0 20px 45px rgba(0,0,0,0.32),
                0 5px 12px rgba(0,0,0,0.18);

            overflow: hidden;
        }

        .letter-envelope::before {
            content: "";

            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    135deg,
                    transparent 49%,
                    rgba(7,27,21,0.14) 50%,
                    transparent 51%
                ),
                linear-gradient(
                    225deg,
                    transparent 49%,
                    rgba(7,27,21,0.14) 50%,
                    transparent 51%
                );
        }

        .letter-flap {
            position: absolute;

            top: -1px;
            left: 0;

            width: 100%;
            height: 55px;

            background: var(--cream);

            clip-path: polygon(
                0 0,
                100% 0,
                50% 100%
            );

            z-index: 4;
        }

        .letter-mark {
            position: absolute;

            right: 10px;
            bottom: 9px;

            width: 25px;
            height: 19px;

            border: 1px solid rgba(232,117,61,0.45);

            display: grid;
            place-items: center;

            color: var(--orange);

            font-size: 8px;

            z-index: 5;
        }

        .letter-lines {
            position: absolute;

            left: 12px;
            bottom: 13px;

            display: flex;
            flex-direction: column;
            gap: 4px;

            z-index: 5;
        }

        .letter-lines span {
            width: 38px;
            height: 2px;
            background: rgba(7,27,21,0.14);
        }

        .letter-lines span:nth-child(2) {
            width: 28px;
        }

        .letter-lines span:nth-child(3) {
            width: 18px;
        }

        @keyframes letterJourney {

            0% {
                opacity: 0;
                transform:
                    translate(
                        -420px,
                        130px
                    )
                    rotate(-22deg)
                    scale(0.7);
            }

            12% {
                opacity: 1;
            }

            38% {
                transform:
                    translate(
                        -190px,
                        -55px
                    )
                    rotate(12deg)
                    scale(0.9);
            }

            58% {
                transform:
                    translate(
                        20px,
                        8px
                    )
                    rotate(-6deg)
                    scale(1);
            }

            68% {
                transform:
                    translate(
                        125px,
                        -28px
                    )
                    rotate(8deg)
                    scale(0.95);
            }

            80% {
                transform:
                    translate(
                        220px,
                        70px
                    )
                    rotate(20deg)
                    scale(0.78);
                opacity: 1;
            }

            94% {
                opacity: 0;
            }

            100% {
                opacity: 0;
                transform:
                    translate(
                        420px,
                        160px
                    )
                    rotate(28deg)
                    scale(0.55);
            }
        }

        /* =====================================================
           ROUTE TRAIL
        ===================================================== */

        .route-trail {
            position: absolute;

            width: 430px;
            height: 160px;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            border-top: 1px dashed
                rgba(243,180,92,0.35);

            border-radius: 50%;

            z-index: 3;

            opacity: 0.55;

            transform-origin: center;

            animation: routeMove 3.8s ease-in-out infinite;
        }

        @keyframes routeMove {
            0% {
                opacity: 0;
                transform:
                    translate(-50%, -50%)
                    scale(0.65)
                    rotate(-8deg);
            }

            20% {
                opacity: 0.6;
            }

            65% {
                opacity: 0.45;
            }

            100% {
                opacity: 0;
                transform:
                    translate(-50%, -50%)
                    scale(1.25)
                    rotate(-8deg);
            }
        }

        /* =====================================================
           TEXT
        ===================================================== */

        .error-content h1 {
            margin-top: 18px;

            font-family: "Manrope", sans-serif;
            font-size: clamp(30px, 4vw, 54px);
            line-height: 1.05;

            letter-spacing: -0.04em;

            color: var(--ivory);
        }

        .error-content h1 span {
            color: var(--orange);
        }

        .error-content p {
            max-width: 570px;
            margin: 18px auto 0;

            color: rgba(250,247,240,0.58);

            font-size: 15px;
            line-height: 1.8;
        }

        /* =====================================================
           BUTTONS
        ===================================================== */

        .error-actions {
            margin-top: 34px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .error-btn {
            min-height: 52px;
            padding: 0 24px;

            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            border: 1px solid transparent;

            text-decoration: none;

            font-family: "DM Sans", sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.04em;

            transition:
                transform .3s ease,
                background .3s ease,
                border-color .3s ease;
        }

        .error-btn.primary {
            background: var(--orange);
            color: #fff;
        }

        .error-btn.primary:hover {
            transform: translateY(-3px);
            background: #f1844b;
        }

        .error-btn.secondary {
            border-color: rgba(250,247,240,0.18);
            color: var(--ivory);
            background: rgba(250,247,240,0.04);
        }

        .error-btn.secondary:hover {
            transform: translateY(-3px);
            border-color: rgba(250,247,240,0.35);
            background: rgba(250,247,240,0.08);
        }

        /* =====================================================
           BOTTOM STATUS
        ===================================================== */

        .error-status {
            position: absolute;

            bottom: 34px;
            left: 50%;

            transform: translateX(-50%);

            display: flex;
            align-items: center;
            gap: 10px;

            color: rgba(250,247,240,0.38);

            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.18em;

            white-space: nowrap;
        }

        .status-dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: var(--orange);

            box-shadow:
                0 0 0 5px rgba(232,117,61,0.08);

            animation: statusPulse 1.8s ease-in-out infinite;
        }

        @keyframes statusPulse {
            0%,
            100% {
                opacity: .5;
                transform: scale(.8);
            }

            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* =====================================================
           FLOATING PARTICLES
        ===================================================== */

        .particle {
            position: absolute;

            width: 4px;
            height: 4px;

            border-radius: 50%;

            background: rgba(243,180,92,0.45);

            animation: particleFloat 5s ease-in-out infinite;
        }

        .particle.one {
            left: 14%;
            top: 30%;
            animation-delay: 0s;
        }

        .particle.two {
            right: 18%;
            top: 22%;
            animation-delay: 1.4s;
        }

        .particle.three {
            left: 22%;
            bottom: 22%;
            animation-delay: 2.3s;
        }

        .particle.four {
            right: 12%;
            bottom: 28%;
            animation-delay: 3.1s;
        }

        @keyframes particleFloat {
            0%,
            100% {
                transform: translateY(0);
                opacity: .25;
            }

            50% {
                transform: translateY(-20px);
                opacity: .8;
            }
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            body {
                overflow: hidden;
            }

            .top-brand {
                top: 24px;
                left: 22px;
            }

            .brand-icon {
                width: 34px;
                height: 34px;
            }

            .error-content {
                width: 92%;
            }

            .error-number {
                height: 170px;
                font-size: clamp(105px, 31vw, 180px);
            }

            .number-zero {
                border-width: 11px;
            }

            .flying-letter {
                width: 82px;
                height: 56px;
            }

            .letter-flap {
                height: 39px;
            }

            .route-trail {
                width: 270px;
                height: 110px;
            }

            .error-content h1 {
                margin-top: 12px;
                font-size: 30px;
            }

            .error-content p {
                font-size: 13px;
                line-height: 1.7;
                max-width: 350px;
            }

            .error-actions {
                flex-direction: column;
                width: 100%;
            }

            .error-btn {
                width: min(290px, 100%);
            }

            .error-status {
                bottom: 22px;
                font-size: 8px;
            }
        }

        @media (max-width: 480px) {

            .brand-copy strong {
                font-size: 15px;
            }

            .brand-copy span {
                font-size: 7px;
            }

            .error-label {
                margin-bottom: 12px;
            }

            .error-number {
                height: 135px;
                font-size: 105px;
            }

            .number-zero {
                border-width: 9px;
            }

            .flying-letter {
                width: 68px;
                height: 46px;
            }

            .letter-flap {
                height: 32px;
            }

            .letter-lines {
                left: 7px;
                bottom: 7px;
            }

            .letter-mark {
                right: 7px;
                bottom: 6px;
                width: 19px;
                height: 14px;
                font-size: 6px;
            }

            .error-content h1 {
                font-size: 26px;
            }

            .error-content p {
                font-size: 12px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

<body>

    <main class="error-page">

        <div class="bg-grid"></div>
        <div class="glow"></div>

        <span class="particle one"></span>
        <span class="particle two"></span>
        <span class="particle three"></span>
        <span class="particle four"></span>

        <!-- BRAND -->
        <a href="index.html" class="top-brand">

            <span class="brand-icon">
                <i class="fa-solid fa-paper-plane"></i>
            </span>

            <span class="brand-copy">
                <strong>NEXORA</strong>
                <span>EXPRESS</span>
            </span>

        </a>


        <!-- MAIN -->
        <section class="error-content">

            <div class="error-label">
                DELIVERY STATUS
            </div>


            <div class="error-number">

                <span>4</span>

                <span class="number-zero"></span>

                <span>4</span>


                <!-- ROUTE -->
                <div class="route-trail"></div>


                <!-- FLYING LETTER -->
                <div class="flying-letter">

                    <div class="letter-envelope">

                        <div class="letter-flap"></div>

                        <div class="letter-lines">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>

                        <div class="letter-mark">
                            N
                        </div>

                    </div>

                </div>

            </div>


            <h1>
                This page took a <span>wrong turn.</span>
            </h1>

            <p>
                The page you’re looking for could not be delivered.
                It may have moved, changed its route, or no longer
                exists at this address.
            </p>


            <div class="error-actions">

                <a href="index.html"
                   class="error-btn primary">

                    <i class="fa-solid fa-house"></i>

                    Back to Home

                </a>


                <a href="tracking.html"
                   class="error-btn secondary">

                    Track a Shipment

                    <i class="fa-solid fa-arrow-right"></i>

                </a>

            </div>

        </section>


        <!-- STATUS -->
        <div class="error-status">

            <span class="status-dot"></span>

            NEXORA DELIVERY NETWORK · ROUTE SEARCHING

        </div>

    </main>

</body>
</html>
